<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="magsafeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="magnetGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#adb5bd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6c757d;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Charger base -->
  <circle cx="150" cy="130" r="50" fill="url(#magsafeGradient)" stroke="#dee2e6" stroke-width="2"/>
  
  <!-- Magnetic ring -->
  <circle cx="150" cy="130" r="35" fill="none" stroke="url(#magnetGradient)" stroke-width="3"/>
  
  <!-- Inner magnetic elements -->
  <circle cx="150" cy="130" r="25" fill="none" stroke="#adb5bd" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Center charging area -->
  <circle cx="150" cy="130" r="15" fill="#f8f9fa" stroke="#ced4da" stroke-width="1"/>
  
  <!-- Cable -->
  <rect x="145" y="180" width="10" height="40" rx="5" fill="#6c757d"/>
  
  <!-- Belkin logo -->
  <text x="150" y="125" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="8" font-weight="bold">BELKIN</text>
  
  <!-- LED indicator -->
  <circle cx="150" cy="140" r="2" fill="#28a745"/>
  
  <!-- Product info -->
  <text x="150" y="250" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="14" font-weight="bold">MagSafe Charger</text>
  <text x="150" y="265" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="12">₹4,999</text>
</svg>
