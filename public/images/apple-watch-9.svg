<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="watchGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1d1d1f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d30;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Watch case -->
  <rect x="100" y="80" width="100" height="120" rx="25" fill="url(#watchGradient)" stroke="#333" stroke-width="2"/>
  
  <!-- Screen -->
  <rect x="110" y="90" width="80" height="100" rx="20" fill="url(#screenGradient)"/>
  
  <!-- Digital Crown -->
  <rect x="200" y="120" width="8" height="15" rx="4" fill="#666"/>
  <circle cx="204" cy="127" r="3" fill="#999"/>
  
  <!-- Side button -->
  <rect x="200" y="145" width="6" height="12" rx="3" fill="#666"/>
  
  <!-- Watch band top -->
  <rect x="130" y="60" width="40" height="20" rx="20" fill="#1d1d1f"/>
  
  <!-- Watch band bottom -->
  <rect x="130" y="200" width="40" height="20" rx="20" fill="#1d1d1f"/>
  
  <!-- Apple logo -->
  <path d="M150 130 C145 125, 140 125, 140 130 C140 135, 145 140, 150 135 C155 140, 160 135, 160 130 C160 125, 155 125, 150 130 Z" fill="#666"/>
  
  <!-- Time display -->
  <text x="150" y="155" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">10:09</text>
  
  <!-- Product info -->
  <text x="150" y="250" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Apple Watch Series 9</text>
  <text x="150" y="265" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="12">₹41,900</text>
</svg>
