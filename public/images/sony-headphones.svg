<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sonyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c2c2c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Headband -->
  <path d="M 80 120 Q 150 60, 220 120" fill="none" stroke="url(#sonyGradient)" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Left ear cup -->
  <circle cx="100" cy="150" r="35" fill="url(#sonyGradient)" stroke="#333" stroke-width="2"/>
  <circle cx="100" cy="150" r="25" fill="#1a1a1a"/>
  
  <!-- Right ear cup -->
  <circle cx="200" cy="150" r="35" fill="url(#sonyGradient)" stroke="#333" stroke-width="2"/>
  <circle cx="200" cy="150" r="25" fill="#1a1a1a"/>
  
  <!-- Sony logo -->
  <text x="150" y="100" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="10" font-weight="bold">SONY</text>
  
  <!-- Touch controls indicator -->
  <circle cx="200" cy="150" r="8" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Product info -->
  <text x="150" y="240" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="14" font-weight="bold">Sony WH-1000XM5</text>
  <text x="150" y="255" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="12">₹29,990</text>
</svg>
